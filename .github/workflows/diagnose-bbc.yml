name: Diagnose BBC page structure

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/diagnose_bbc_page.py'
      - '.github/workflows/diagnose-bbc.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print page structure only
        run: python scripts/diagnose_bbc_page.py
