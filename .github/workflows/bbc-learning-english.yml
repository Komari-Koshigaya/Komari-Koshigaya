# Requires a repository secret named SERVERCHAN_SENDKEY (a Server酱 SendKey).
name: BBC Learning English -> WeChat

on:
  schedule:
    # GitHub cron is UTC. These are 08:00/09:00/10:00 and
    # 20:00/21:00/22:00 in Beijing (UTC+8). The later runs are backups:
    # GitHub can delay or drop scheduled runs under load, and the script
    # skips a slot that was already pushed (state cache).
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which push slot? auto uses the Beijing hour.'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - morning
          - evening
      dry_run:
        description: 'Only print the message; do not push or save state.'
        required: false
        default: false
        type: boolean
      force:
        description: 'Force a push even if this slot was already sent.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bbc-learning-english
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore sent-episode state
        uses: actions/cache@v4
        with:
          path: .state
          key: bbc-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bbc-state-

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Resolve push slot
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 12 * * *"|"0 13 * * *"|"0 14 * * *")
                echo "PUSH_SLOT=evening" >> "$GITHUB_ENV"
                ;;
              *)
                echo "PUSH_SLOT=morning" >> "$GITHUB_ENV"
                ;;
            esac
          else
            slot="${{ github.event.inputs.slot }}"
            if [ -z "$slot" ]; then
              slot="auto"
            fi
            echo "PUSH_SLOT=$slot" >> "$GITHUB_ENV"
          fi

      - name: Push to WeChat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          STATE_FILE: .state/bbc_learning_english.json
        run: |
          mkdir -p .state
          args=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            args="--force"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/push_bbc_learning_english.py --dry-run --preview-chars 600 $args
          else
            python scripts/push_bbc_learning_english.py $args
          fi
